{% extends "base.html" %} {% block title %}Register - BotSaaS{% endblock %} {%
block content %}
<div
  class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8"
>
  <div class="max-w-md w-full space-y-8">
    <div>
      <div class="flex justify-center">
        <i class="fas fa-robot text-6xl text-blue-600"></i>
      </div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        Create your account
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Already have an account?
        <a
          href="/auth/login"
          class="font-medium text-blue-600 hover:text-blue-500"
        >
          Sign in
        </a>
      </p>
    </div>

    <form class="mt-8 space-y-6" id="registerForm">
      <div class="space-y-4">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700"
            >Full Name</label
          >
          <input
            id="name"
            name="name"
            type="text"
            required
            class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
            placeholder="John Doe"
          />
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700"
            >Email address</label
          >
          <input
            id="email"
            name="email"
            type="email"
            required
            class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
            placeholder="you@example.com"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700"
            >Password</label
          >
          <input
            id="password"
            name="password"
            type="password"
            required
            class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
            placeholder="••••••••"
          />
          <p class="mt-1 text-xs text-gray-500">Minimum 6 characters</p>
        </div>

        <div>
          <label
            for="confirm_password"
            class="block text-sm font-medium text-gray-700"
            >Confirm Password</label
          >
          <input
            id="confirm_password"
            name="confirm_password"
            type="password"
            required
            class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
            placeholder="••••••••"
          />
        </div>
      </div>

      <div>
        <button
          type="submit"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
        >
          <span class="absolute left-0 inset-y-0 flex items-center pl-3">
            <i class="fas fa-user-plus"></i>
          </span>
          Create Account
        </button>
      </div>

      <div
        id="errorMessage"
        class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative"
        role="alert"
      >
        <span class="block sm:inline"></span>
      </div>

      <div
        id="successMessage"
        class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative"
        role="alert"
      >
        <span class="block sm:inline"></span>
      </div>
    </form>

    <!-- Terms -->
    <p class="mt-4 text-center text-xs text-gray-500">
      By signing up, you agree to our
      <a href="#" class="text-blue-600 hover:text-blue-500">Terms of Service</a>
      and
      <a href="#" class="text-blue-600 hover:text-blue-500">Privacy Policy</a>
    </p>
  </div>
</div>

<script>
  document
    .getElementById("registerForm")
    .addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm_password").value;
      const errorDiv = document.getElementById("errorMessage");
      const successDiv = document.getElementById("successMessage");

      // Hide previous messages
      errorDiv.classList.add("hidden");
      successDiv.classList.add("hidden");

      // Validation
      if (password !== confirmPassword) {
        errorDiv.querySelector("span").textContent = "Passwords do not match";
        errorDiv.classList.remove("hidden");
        return;
      }

      if (password.length < 6) {
        errorDiv.querySelector("span").textContent =
          "Password must be at least 6 characters";
        errorDiv.classList.remove("hidden");
        return;
      }

      try {
        const response = await fetch("/auth/api/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ name, email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          // Show success message
          successDiv.querySelector("span").textContent =
            "Account created successfully! Redirecting...";
          successDiv.classList.remove("hidden");

          // Store token
          document.cookie = `access_token=${data.access_token}; path=/; max-age=604800`;

          // Redirect after 2 seconds
          setTimeout(() => {
            window.location.href = "/dashboard";
          }, 2000);
        } else {
          errorDiv.querySelector("span").textContent =
            data.detail || "Registration failed";
          errorDiv.classList.remove("hidden");
        }
      } catch (error) {
        errorDiv.querySelector("span").textContent =
          "Network error. Please try again.";
        errorDiv.classList.remove("hidden");
      }
    });
</script>
{% endblock %}
